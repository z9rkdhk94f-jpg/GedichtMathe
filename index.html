.hero,.station-hero{background:#191a33;color:white;position:relative;isolation:isolate;overflow:hidden}.hero{min-height:350px}.hero-photo,.hero-wash,.s-photo{position:absolute;inset:0;z-index:-1}.hero-photo{left:32%;background:var(--photo3) 64% 52%/cover no-repeat}.hero-wash{background:linear-gradient(90deg,#181a32 0%,#1b1b37 27%,rgba(34,29,61,.91) 39%,rgba(31,27,64,.48) 56%,rgba(18,18,41,.06) 78%),linear-gradient(0deg,rgba(21,16,45,.2),transparent 45%)}.hero-copy{padding:41px 0 36px}.hero .eyebrow{color:#d1ceeb;display:flex;align-items:center;gap:11px}.hero .eyebrow:before{content:'';width:27px;height:3px;background:var(--lime)}.hero h1{font-size:clamp(3.1rem,5.5vw,4.65rem);line-height:1.01;letter-spacing:-.035em;margin:.66rem 0 .76rem}.hero h1 em{font:inherit;color:var(--lime)}.hero-copy>p:not(.eyebrow){color:#eceaf5;font-size:1.08rem;max-width:460px}.hero-copy .btn{margin-top:1.1rem}.track{background:var(--lime);height:4px;display:flex;overflow:hidden}.track i{flex:1}.track i:nth-child(2){background:#ffbd82}.track i:nth-child(3){background:#bba8ff}.track i:nth-child(4){background:#7bd9de}

  <dialog id="poem-dialog" aria-labelledby="poem-title"><div class="dialog-head"><div><p class="eyebrow">Klassengedicht</p><h2 id="poem-title">Wir sind die 7b</h2><i>7b</i></div><button type="button" class="icon-btn" data-close aria-label="Gedicht schließen"><span class="glyph" data-icon="x"></span></button></div><div id="dialog-poem"></div></dialog>
  <dialog id="reset-dialog" class="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">Lernstand zurücksetzen?</h2><p>Damit löschst du die Eingaben und Häkchen aller drei Sternstufen auf diesem Gerät.</p><div class="dialog-actions"><button class="btn pale" data-close>Abbrechen</button><button class="btn dark" data-action="reset-confirm">Zurücksetzen</button></div></dialog>
  <dialog id="log-dialog" aria-labelledby="log-title"><div class="dialog-head"><div><p class="eyebrow">Meine Einträge</p><h2 id="log-title">Mein Laufzettel</h2></div><button type="button" class="icon-btn" data-close aria-label="Laufzettel schließen"><span class="glyph" data-icon="x"></span></button></div><div id="log-body"></div></dialog>
  <noscript>Bitte aktiviere JavaScript, um die vier Stationen zu bearbeiten.</noscript>
  <script>(() => {

'use strict';
const sourceVerses = [
  ['Herr Müksch sucht seinen Stift im ganzen Land.', [1,2,5,8],[7],[3]],
  ['Wir grinsen nur. Er hält ihn in der Hand.', [9],[],[2,5]],
  ['Die coolste Klasse flüstert heute leise.', [3],[2,6],[4]],
  ['Der Nachbarraum hört mit – auf wundersame Weise.', [2,7],[6],[3]],
  ['Unsere Playlist bringt uns in Fahrt.', [2,6],[],[3]],
  ['Ein Tisch wird zum Schlagzeug, der Beat ist hart.', [2,5,7],[9],[3,8]],
  ['Beim Disc-Golf zielen wir auf Korb Nummer zwei.', [2,6,7],[],[3]],
  ['Die Scheibe fliegt am dritten auch vorbei.', [2],[5],[3]],
  ['Dank logo! ist uns die Welt heut klar.', [2,6],[8],[3]],
  ['Sogar, was gestern in den Nachrichten war.', [6],[],[7]],
  ['Am liebsten gehn wir jede Stunde raus.', [6],[],[3]],
  ['Zur Not sieht auch der Hof wie Schulstoff aus.', [2,6,8],[],[3]],
  ['GPG in Stunde acht? O weh!', [1,3],[],[]],
  ['Selbst unser Atlas träumt vom Badesee.', [3,6],[],[4]],
  ['Beim Streit sagen wir’s uns ins Gesicht.', [2,7],[],[3]],
  ['Wir sind die 7b. Uns trennt das nicht!', [4],[],[2,6]]
];
const rivalLines=['Im Flur erklingt ein Ton.','Die Türen klappern schon.','Ein Beat erfüllt das Haus.','Wir tanzen in die Pause raus.'];
const categories={N:'Nomen und Namen',A:'Adjektive',V:'Verbformen',O:'Übrige Wörter'};
const categoryKeys=Object.keys(categories);
const verses=sourceVerses.map(([text,nouns,adjectives,verbs],i)=>{
  let index=0;
  const words=text.split(' ').map(value=>{
    if(value==='–')return {value,word:false};
    index+=1;
    const type=nouns.includes(index)?'N':adjectives.includes(index)?'A':verbs.includes(index)?'V':'O';
    return {value,word:true,id:`${i+1}.${index}`,type};
  });
  return {id:i+1,text,words,count:index};
});
const stanzas=Array.from({length:4},(_,i)=>verses.slice(i*4,i*4+4));
const allWords=verses.flatMap(v=>v.words.filter(w=>w.word));
const total=allWords.length;
const amounts=Object.fromEntries(categoryKeys.map(c=>[c,allWords.filter(w=>w.type===c).length]));
const stanzaCounts=stanzas.map(s=>s.reduce((n,v)=>n+v.count,0));
const perStanza=stanzas.map(s=>Object.fromEntries(categoryKeys.map(c=>[c,s.flatMap(v=>v.words).filter(w=>w.type===c).length])));
const info={
  1:{title:'Wörter zählen',blurb:'Wie viele Wörter, Verse und Strophen?',icon:'search'},
  2:{title:'Wortarten sortieren',blurb:'Welchen Anteil hat jede Wortart?',icon:'tag'},
  3:{title:'Balken bauen',blurb:'Wie werden aus Wortzahlen Balken?',icon:'bars'},
  4:{title:'Das Klassenduell',blurb:'Wer hat den größeren Nomenanteil?',icon:'duel'},
  5:{title:'Ein Vers kommt dazu',blurb:'Wie verändert sich der Adjektivanteil?',icon:'note'}
};
const levelNames={1:'Mit Zähl- und Rechenhilfen',2:'Mit einzelnen Starthilfen',3:'Selbstständig und mit Transfer'};
const countSteps=['Strophe 1','Strophe 2','Strophe 3','Strophe 4','Bilanz'];
function steps(s,l){
  if(s===5)return ['Bonusvers'];
  if(s===1)return countSteps;
  if(s===2)return ['Markieren','Anteile'];
  if(s===3)return ['Balkendiagramm',l===3?'Prozentstreifen':'Auswerten'];
  return ['Nomenanteile','Vergleichen'];
}
const iconPaths={
 book:'<path d="M3 5.3c3-.9 6.4-.3 9 1.3 2.6-1.6 6-2.2 9-1.3v13c-3-.9-6.4-.2-9 1.3-2.6-1.5-6-2.2-9-1.3zM12 6.6v13"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 search:'<circle cx="10.2" cy="10.2" r="6.5"/><path d="m15.1 15.1 5.3 5.3"/>',
 tag:'<path d="M3.5 4h8.2l9 9-7.6 7.6-9.6-9.7z"/><circle cx="8.3" cy="8.2" r="1"/>',
 bars:'<path d="M3.5 3.5v17h17M7 6.3h6M7 11h12M7 15.7h9"/>',
 duel:'<path d="M8 3h8v4.8c0 3.4-1.6 6-4 6.8-2.4-.8-4-3.4-4-6.8zM8 5H4v2c0 3 1.8 4 4.9 4.4M16 5h4v2c0 3-1.8 4-4.9 4.4M12 15v4M8 21h8"/>',
 check:'<path d="m4 12 5 5L20 6"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',
 note:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 16h4"/>'
};
const ico=name=>`<span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconPaths[name]||''}</svg></span>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two=n=>String(n).padStart(2,'0');
const STORAGE='gedichtstudio.7b.stationen.v1';
const fresh=()=>({level:1,records:{},name:''});
let canStore=true;
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORAGE)||'null');
    if(!raw||!raw.records||typeof raw.records!=='object')return fresh();
    return {level:[1,2,3].includes(raw.level)?raw.level:1,records:raw.records,name:typeof raw.name==='string'?raw.name.slice(0,60):''};
  }catch{canStore=false;return fresh();}
}
let state=load();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{canStore=false;}}
function newRecord(){return {values:{},done:{},marks:{},tokens:{},changed:{},fixed:{},viewable:{},last:0,opened:false,rating:'',reviewed:false};}
function record(s,l=state.level){
  const key=`${l}-${s}`,r=state.records[key];
  if(!r||typeof r!=='object'||Array.isArray(r))return state.records[key]=newRecord();
  for(const k of ['values','done','marks','tokens','changed','fixed','viewable'])if(!r[k]||typeof r[k]!=='object'||Array.isArray(r[k]))r[k]={};
  return r;
}
function tasksDone(s,l=state.level){const r=record(s,l);return steps(s,l).every((_,i)=>r.done[i]===true);}
function complete(s,l=state.level){const r=record(s,l);return tasksDone(s,l)&&(s===5||(r.reviewed===true&&['leicht','mittel','schwer'].includes(r.rating)));}
function progress(l=state.level){return [1,2,3,4].filter(s=>complete(s,l)).length;}
function num(v,allowPercent=false){
  let text=String(v??'').trim();
  if(allowPercent)text=text.replace(/\s*%\s*$/,'');
  if(!/^\d+(?:[.,]\d+)?$/.test(text))return NaN;
  return Number(text.replace(',','.'));
}
function equivalent(v,n,d){
  const m=String(v??'').match(/^\s*(\d+)\s*[/⁄]\s*(\d+)\s*$/);
  if(!m)return false;
  const a=Number(m[1]), b=Number(m[2]);
  return b>0&&Number.isSafeInteger(a)&&Number.isSafeInteger(b)&&a*d===n*b;
}
function percentOK(v,target){
  const x=num(v,true);
  if(!Number.isFinite(x))return false;
  const tenths=Math.round((target+Number.EPSILON)*10)/10;
  return Math.abs(x-tenths)<1e-7||Math.abs(x-target)<.005001;
}
function evaluate(s,l,step,r){
  const errors=[], a=r.values;
  const test=(key,ok,msg)=>{if(!ok)errors.push({key,msg});};
  const integer=(key,value,msg)=>test(key,num(a[key])===value,msg);
  const fraction=(key,n,d,msg)=>test(key,equivalent(a[key],n,d),msg);
  const percent=(key,target,msg)=>test(key,percentOK(a[key],target),msg);
  const choice=(key,expected,msg)=>test(key,a[key]===expected,msg);
  if(s===1&&step<4){
    for(const v of stanzas[step])integer('v'+v.id,v.count,`Zähle die Wörter in Vers ${two(v.id)} noch einmal. Jedes geschriebene Wort zählt einmal.`);
    integer('sum'+step,stanzaCounts[step],`Addiere die vier Wortzahlen der Strophe ${step+1}.`);
  }else if(s===1){
    integer('strophen',4,'Jeder abgesetzte Block enthält eine Strophe.');
    integer('verse',16,'Zähle alle nummerierten Gedichtzeilen.');
    integer('gesamt',total,'Addiere die Wortzahlen der vier Strophen.');
    if(l===1){
      integer('vnum',4,'Wie viele der 16 Verse stehen in einer Strophe?');
      choice('vshare','25','Überlege, wie viel von vier gleich großen Versgruppen eine Gruppe ausmacht.');
    }else{
      if(l===2)fraction('vfrac',4,16,'Beim Versanteil steht oben die Verszahl einer Strophe und unten die Verszahl des ganzen Gedichts.');
      percent('vperc',25,'Teile die Verszahl der Strophe durch die gesamte Verszahl und multipliziere mit 100.');
    }
    if(l===3){
      percent('wperc',100*stanzaCounts[0]/total,'Teile die Wörter der ersten Strophe durch alle Wörter und multipliziere mit 100.');
      test('reason',String(a.reason||'').trim().length>0,'Erkläre in eigenen Worten, warum sich beide Anteile unterscheiden.');
    }
  }else if(s===2&&step===0){
    const group=l===2?verses.slice(0,4):verses;
    for(const v of group){
      for(const w of v.words.filter(w=>w.word)){
        const target=l===1?(w.type==='A'?'A':'O'):w.type;
        if((r.marks[w.id]||'O')!==target){
          errors.push({key:'mark',stanza:Math.floor((v.id-1)/4),token:w.id,msg:`Prüfe Vers ${two(v.id)}. Bei „${w.value}“ passt die Markierung noch nicht. ${l===1?'Frage dich, ob das Wort eine Eigenschaft oder ein Wie beschreibt.':'Prüfe die Wortart im Satz.'}`});
          return errors;
        }
      }
    }
  }else if(s===2){
    for(const c of categoryKeys){
      integer('n'+c,amounts[c],`Prüfe die Anzahl für „${categories[c]}“. ${c==='O'?'Ziehe die anderen drei Anzahlen vom Grundwert ab.':'Addiere die Treffer der vier Strophen.'}`);
      integer('f'+c,amounts[c],`Prüfe den Zähler des Bruchs für „${categories[c]}“. Der Nenner ist die Gesamtwortzahl.`);
      percent('p'+c,100*amounts[c]/total,`Prüfe den Prozentsatz für „${categories[c]}“. Teile die Trefferzahl durch den Grundwert und multipliziere mit 100.`);
    }
  }else if(s===3&&step===0){
    for(const c of categoryKeys)integer('bar'+c,amounts[c],`Vergleiche den Balken für „${categories[c]}“ mit der Wortzahl auf der Materialkarte.`);
  }else if(s===3&&l===1)choice('long','O','Vergleiche die vier Balkenlängen bei gleichem Startpunkt.');
  else if(s===3&&l===2)integer('diff',amounts.O-amounts.N,'Ziehe die Anzahl der Nomen und Namen von der Anzahl der übrigen Wörter ab.');
  else if(s===3){
    let cumulative=0;
    ['N','A','V'].forEach((c,i)=>{cumulative+=amounts[c];integer('cut'+i,Math.round(100*cumulative/total),`Prüfe Grenze ${i+1}. Addiere zuerst die Wortzahlen bis zu dieser Grenze, rechne in Prozent um und runde am Ende auf ganze Prozent.`);});
    categoryKeys.forEach((c,i)=>choice('seg'+i,c,`Beschrifte Abschnitt ${i+1} passend zur Reihenfolge der Materialkarte.`));
  }else if(s===5){
    for(const [i,w] of ['Der','bunte','Ball','fliegt','weit'].entries()){
      const target=i===1||i===4;
      if(Boolean(r.tokens['bonus'+i])!==target){errors.push({key:'bonus-mark',msg:'Prüfe die Adjektive im neuen Vers. Welches Wort beschreibt den Ball? Welches beschreibt, wie er fliegt?'});break;}
    }
    integer('neuA',9,'Zähle die neuen Adjektive zu den bisherigen sieben.');
    integer('neuW',123,'Zähle die Wörter des neuen Verses zu den bisherigen 118.');
    percent('neuP',900/123,'Teile den neuen Zähler durch den neuen Nenner und multipliziere mit 100.');
    choice('richtung','steigt','Vergleiche den neuen Prozentsatz mit den bisherigen 5,9 %.');
  }else if(s===4&&step===0){
    if(l!==2){
      integer('bw',total,'Übertrage die gesamte Wortzahl des Gedichts der 7b.');
      integer('bn',amounts.N,'Übertrage die Anzahl der Nomen und Namen der 7b.');
      integer('cw',20,'Zähle die Wörter im Gedicht der 7c Vers für Vers. Den Titel lässt du aus.');
      integer('cn',6,'Prüfe die Nomen in den vier Versen der 7c.');
    }else{
      fraction('fb',amounts.N,total,'Prüfe den Bruch für die 7b. Der ganze Gedichttext ist dein Grundwert.');
      fraction('fc',6,20,'Beim Bruch der 7c gehören Zähler und Nenner zum Gedicht „Der Pausenbeat“.');
    }
    percent('pb',100*amounts.N/total,'Berechne den Nomenanteil der 7b aus ihrem eigenen Grundwert.');
    percent('pc',30,'Berechne den Nomenanteil der 7c aus ihrem eigenen Grundwert.');
  }else{
    choice('sieger','7c','Vergleiche die Prozentsätze der beiden Klassen.');
    test('vergleich',String(a.vergleich||'').trim().length>0,'Trage deinen Vergleich in eigenen Worten ein.');
    if(l===3)percent('abstand',30-100*amounts.N/total,'Der Abstand in Prozentpunkten ist die Differenz der zwei Prozentsätze.');
  }
  return errors;
}



const $=s=>document.querySelector(s);
const main=$('#main');
let station=0, feedback=null, hintOpen=false, markGroup=0, brush='N';
const validId=i=>Number.isInteger(i)&&i>=1&&i<=5;
const hashStation=()=>{if(location.hash==='#bonus')return 5;const m=location.hash.match(/^#station-([1-4])$/);return m?Number(m[1]):0;};
function part(){const n=record(station).last;return Number.isInteger(n)&&n>=0&&n<steps(station,state.level).length?n:0;}
function levelPicker(){
  return `<div class="level-group"><span>Sternstufe</span><div class="levels" role="group" aria-label="Sternstufe wählen">${[1,2,3].map(l=>`<button type="button" class="level-btn${state.level===l?' chosen':''}" data-level="${l}" aria-pressed="${state.level===l}" aria-label="${l} ${l===1?'Stern':'Sterne'} – ${levelNames[l]}" title="${levelNames[l]}">${'★'.repeat(l)}</button>`).join('')}</div></div>`;
}
function renderHome(){
  const done=progress(),started=[1,2,3,4].find(id=>record(id).opened&&!complete(id));
  const action=started?`href="#station-${started}"`:'href="#laufzettel"';
  main.innerHTML=`<section class="hero"><div class="hero-photo" aria-hidden="true"></div><div class="hero-wash" aria-hidden="true"></div><div class="wrap"><div class="hero-copy">
    <p class="eyebrow">Bruch- und Prozentrechnung</p><h1>Wenn Reime<br><em>zu Zahlen werden.</em></h1>
    <p>Untersuche unser Klassengedicht „Wir sind die 7b“ an vier Mathe-Stationen.</p>
    <a class="btn green" ${action}>${ico(started?'note':'grid')}${started?'Weiterarbeiten':'Station auswählen'}</a>
  </div></div></section><div class="track" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <section class="wrap studio" id="laufzettel" aria-labelledby="deck-title">
    <div class="studio-top"><div><h2 id="deck-title">Dein Laufzettel</h2><p class="sub">Wähle deine Sternstufe. Du kannst an jeder Station beginnen.</p></div>${levelPicker()}</div>
    <div class="deck">${[1,2,3,4].map(id=>{
      const s=info[id],status=complete(id)?'finished':record(id).opened?'started':'';
      const text=status==='finished'?'Erledigt':status==='started'?'Begonnen':'Offen';
      return `<a class="station-card station0${id}" href="#station-${id}" aria-label="Station ${id}, ${esc(s.title)}, ${text}"><div class="card-photo"><span class="station-tag">Station ${two(id)}</span><span class="card-icon">${ico(s.icon)}</span></div><div class="card-body"><h3>${s.title}</h3><p>${s.blurb}</p><div class="card-bottom"><span class="statusword ${status}"><i></i>${text}</span><span class="card-action">${status==='finished'?'Ansehen':status==='started'?'Fortsetzen':'Starten'}</span></div></div></a>`;
    }).join('')}</div>
    <div class="progress-panel"><div><strong>${done===4?'Alle vier Stationen geschafft!':`${done} von 4 Stationen erledigt`}</strong><p>${done===4?'Du kannst deine Ergebnisse in jeder Station noch einmal ansehen.':`Dein Fortschritt auf Sternstufe ${state.level}.`}</p></div><div class="progressbar" role="progressbar" aria-label="Erledigte Stationen" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="4"><i style="width:${done*25}%"></i></div></div>
    <div class="extra-row"><a class="bonus-link" href="#bonus">${ico('note')} <span><b>Bonusvers</b> · Ein Vers kommt dazu</span></a><button class="btn pale" data-action="log">${ico('note')}Laufzettel vorzeigen</button></div>
    ${!canStore?'<p class="sys-note">Der Browser kann deinen Lernstand nur so lange behalten, wie diese Seite geöffnet ist.</p>':''}
  </section>`;
}
function field(key,label,opt={}){
  const val=esc(record(station).values[key]??'');
  const mode=opt.fraction?'text':opt.decimal?'decimal':'numeric';
  return `<input class="answer${opt.fraction?' wide':''}" id="f-${key}" data-field="${key}" aria-label="${esc(label)}" inputmode="${mode}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="18" value="${val}" placeholder="${opt.fraction?'…/…':'…'}">`;
}
function labelled(key,label,opt={}){
  return `<label class="field" for="f-${key}"><span>${esc(label)}</span><span class="field-line">${field(key,label,opt)}${opt.unit?` <em>${esc(opt.unit)}</em>`:''}</span></label>`;
}
function choices(key,title,items){
  return `<fieldset class="groupbox" data-group="${key}"><legend>${esc(title)}</legend><div class="choices">${items.map(([val,txt])=>`<button type="button" class="choice" data-choice="${key}" data-value="${esc(val)}" aria-pressed="${record(station).values[key]===val}">${esc(txt)}</button>`).join('')}</div></fieldset>`;
}
function modalPoem(){
  return stanzas.map((s,i)=>`<div class="poem-group" aria-label="Strophe ${i+1}">${s.map(v=>`<p><span class="verse-no">${two(v.id)}</span><span>${esc(v.text)}</span></p>`).join('')}</div>`).join('');
}
function tokensFor(v,r){
  return v.words.map(w=>w.word?`<button class="word-chip" data-token="${w.id}" aria-pressed="${Boolean(r.tokens[w.id])}">${esc(w.value)}</button>`:'<span class="punct" aria-hidden="true">–</span>').join(' ');
}
function countTask(step,l,r){
  if(step<4){
    const help=l===1?'Tippe die Wörter einzeln an und trage ihre Anzahl ein. Addiere danach die vier Zeilen.':l===2?'Zähle die Wörter in jedem Vers. Addiere die vier Ergebnisse für die ganze Strophe.':'Ermittle die Wortzahl jedes Verses und die Wortzahl der Strophe.';
    const body=stanzas[step].map(v=>{
      const count=v.words.filter(w=>w.word&&r.tokens[w.id]).length;
      return `<div class="count-row"><span class="verse-no">${two(v.id)}</span><div>${l===1?`<div class="chips">${tokensFor(v,r)}</div><span class="token-count" id="wc-${v.id}">${count} angetippt</span>`:`<p class="verse-text">${esc(v.text)}</p>`}</div>${field('v'+v.id,'Wortzahl Vers '+v.id)}</div>`;
    }).join('');
    return {title:'Wie viele Wörter hat Strophe '+(step+1)+'?',lead:help,body:body+`<label class="sum-block" for="f-sum${step}"><b>Wörter in Strophe ${step+1}</b>${field('sum'+step,'Wörter in Strophe '+(step+1))}</label>`,hint:'Gehe von links nach rechts. Auch kurze Wörter wie „im“ und „am“ zählen jeweils einmal. Die Versnummern gehören nicht zum Gedicht.'};
  }
  const written=stanzaCounts.map((_,i)=>esc(r.values['sum'+i]||'…'));
  let body=`<div class="totals-line"><b>Deine vier Strophensummen</b> &nbsp; ${written.join(' + ')}</div><div class="field-row">${labelled('strophen','Strophen')}${labelled('verse','Verse')}${labelled('gesamt','Wörter insgesamt')}</div>`;
  if(l===1)body+=`<div class="field-row">${labelled('vnum','Verse in einer Strophe',{unit:'von 16 Versen'})}</div>`+choices('vshare','Welchen Anteil an allen Versen hat eine Strophe?',[['10','10 %'],['25','25 %'],['50','50 %']]);
  else body+=`<div class="field-row">${l===2?labelled('vfrac','Versanteil der ersten Strophe',{fraction:true}):''}${labelled('vperc','Versanteil der ersten Strophe',{decimal:true,unit:'%'})}</div>`;
  if(l===3)body+=`<div class="field-row">${labelled('wperc','Wortanteil der ersten Strophe',{decimal:true,unit:'%'})}</div>`+writing('reason','Warum sind Versanteil und Wortanteil verschieden?');
  return {title:'Was zählt das ganze Gedicht?',lead:l===3?'Vergleiche am Ende den Versanteil und den Wortanteil der ersten Strophe. Runde auf eine Nachkommastelle.':'Trage die Gesamtzahlen ein. Bestimme dann den Versanteil einer Strophe.',body,hint:'Für den Versanteil teilst du die Verse einer Strophe durch alle Verse. Für den Wortanteil verwendest du entsprechend die Wortzahlen.'};
}
function markTask(l,r){
  const types=l===1?['A']:['N','A','V','O'];
  const active=l===1?'A':brush;
  const toolNames={...categories,O:'Markierung löschen'};
  const tools=types.map(c=>`<button type="button" class="tool-tag ${c}${active===c?' active':''}" data-brush="${c}" aria-pressed="${active===c}"><span class="dot"></span>${toolNames[c]}</button>`).join('');
  const tabs=l===2?'':`<div class="mark-tabs" role="group" aria-label="Strophe zum Markieren">${stanzas.map((_,i)=>`<button type="button" class="tab-small" data-mark-stanza="${i}" aria-current="${markGroup===i}">Strophe ${i+1}</button>`).join('')}</div>`;
  const selected=l===2?0:markGroup;
  const lines=stanzas[selected].map(v=>`<div class="word-row"><span class="verse-no">${two(v.id)}</span><div class="word-line">${v.words.map(w=>{
    if(!w.word)return '<span class="punct">–</span>';
    const stored=r.marks[w.id],tag=['N','A','V'].includes(stored)?stored:'O',marked=tag!=='O';
    return `<button type="button" class="tag-word${marked?' tagged '+tag:''}" data-mark="${w.id}" aria-pressed="${marked}" aria-label="${esc(w.value)}, ${marked?categories[tag]:'ohne Markierung'}">${esc(w.value)}${marked?`<small aria-hidden="true">${tag}</small>`:''}</button>`;
  }).join(' ')}</div></div>`).join('');
  return {title:l===1?'Finde die Adjektive':l===2?'Sortiere die erste Strophe':'Sortiere das ganze Gedicht',
    lead:l===1?'Tippe in allen vier Strophen die Adjektive an. Ein zweiter Tipp nimmt die Markierung zurück.':`Wähle eine Wortart und tippe die passenden Wörter ${l===2?'in Strophe 1':'in allen vier Strophen'} an. Übrige Wörter bleiben frei.`,
    body:`${tabs}<div class="mark-tools" role="group" aria-label="Markierwerkzeug">${tools}</div>${lines}<p class="small-note">Jetzt sichtbar: Strophe ${selected+1}. Beim Prüfen gelten ${l===2?'die vier Verse dieser Strophe':'alle vier Strophen'}.</p>`,
    hint:'Ein Nomen benennt zum Beispiel Dinge und Namen. Ein Adjektiv beschreibt, wie etwas ist oder geschieht. Markiere bei einem trennbaren Verb nur den gebeugten Teil.'};
}
function amountsTask(l,r){
  const rows=categoryKeys.map(c=>{
    const countLabel='Anzahl '+categories[c];
    return `<tr><th scope="row"><span class="name-dot ${c}"><span class="dot"></span>${categories[c]}</span></th><td>${field('n'+c,countLabel)}</td><td><span class="fraction-cell">${field('f'+c,'Zähler des Bruchs für '+categories[c])}<span>/ ${total}</span></span></td><td><span class="field-suffix">${field('p'+c,'Prozentsatz '+categories[c],{decimal:true})} %</span></td></tr>`;
  }).join('');
  return {title:'Wie groß ist jeder Anteil?',lead:`Nutze alle ${total} Wörter als Grundwert. Trage Anzahl, Bruch und Prozentsatz ein. Runde auf eine Nachkommastelle.`,
    body:`<table class="data-table"><thead><tr><th>Wortgruppe</th><th>Anzahl</th><th>Bruch</th><th>Prozent</th></tr></thead><tbody>${rows}</tbody></table>${l===3?'<p class="small-note">Ermittle die übrigen Wörter durch Subtraktion.</p>':''}`,hint:'Prozentsatz in % = Anzahl der Wörter einer Gruppe ÷ Gesamtwortzahl × 100. Für die übrigen Wörter ziehst du die drei bekannten Gruppen vom Ganzen ab.'};
}
function barsTask(r){
  const rows=categoryKeys.map(c=>{
    const n=clamp(num(r.values['bar'+c]),0,70);
    return `<div class="chart-row ${c}"><span class="chart-name">${categories[c]}</span><span class="rail"><span id="fill-${c}" class="bar-fill" style="width:${n/70*100}%"></span><input type="range" min="0" max="70" step="1" value="${n}" data-range="bar${c}" aria-label="Balken ${categories[c]} einstellen"></span>${field('bar'+c,'Balkenlänge '+categories[c])}</div>`;
  }).join('');
  return {title:'Baue dein Balkendiagramm',lead:'Stelle vier Balken anhand der Materialkarte ein. Tippe oder ziehe auf der Skala. Rechts kannst du die Wortzahl auch direkt eingeben.',
    body:`<figure class="chart" aria-label="Interaktives Balkendiagramm, Wortanzahl von 0 bis 70">${rows}<div class="chart-scale"><span></span><div class="axis">${[0,10,20,30,40,50,60,70].map(n=>`<span>${n}</span>`).join('')}</div><span></span></div><figcaption class="small-note">Einheit: Wörter. Alle Balken beginnen bei null.</figcaption></figure>`,
    hint:'Übertrage die absoluten Wortzahlen von der Materialkarte. Jeder große Abstand zwischen zwei beschrifteten Strichen entspricht zehn Wörtern.'};
}
function clamp(value,min,max){return Number.isFinite(value)?Math.min(max,Math.max(min,value)):min;}
function stripVisual(r){
  const edges=[0,...[0,1,2].map(i=>num(r.values['cut'+i])),100];
  if(edges.some(x=>!Number.isFinite(x)))return `<div class="strip" role="img" aria-label="Prozentstreifen, noch unvollständig"></div><p class="tiny">Trage die drei Grenzen ein, um deinen Streifen zu sehen.</p>`;
  if(edges.some((x,i)=>i&&(x<edges[i-1]||x>100)))return `<div class="strip" role="img" aria-label="Grenzen überprüfen"></div><p class="tiny">Die Grenzen müssen von links nach rechts ansteigen und im Streifen liegen.</p>`;
  return `<div class="strip" role="img" aria-label="Deine Grenzen bei ${edges.join(', ')} Prozent">${categoryKeys.map((c,i)=>`<span class="${c}" style="width:${edges[i+1]-edges[i]}%"><b>${i+1}</b></span>`).join('')}</div><p class="tiny">Grenzen: ${edges.join(' % · ')} %</p><div class="strip-legend">${categoryKeys.map((c,i)=>`<span class="${c}"><i class="dot"></i>${i+1} · ${esc(categories[r.values['seg'+i]]||'…')}</span>`).join('')}</div>`;
}
function chartQuestion(l,r){
  if(l===3)return {title:'Teile den Prozentstreifen ein',lead:'Setze drei Grenzen für die vier Wortgruppen. Addiere zuerst die Wortzahlen bis zur jeweiligen Grenze. Runde jede Grenze erst am Ende auf ganze Prozent.',
    body:`<div class="strip-head"><span>0 %</span><span>100 %</span></div><div id="strip-live">${stripVisual(r)}</div><div class="strip-fields">${['nach Nomen','nach Adjektiven','nach Verbformen'].map((t,i)=>labelled('cut'+i,`Grenze ${i+1} · ${t}`,{unit:'%'})).join('')}</div>`,
    hint:'Für die zweite Grenze addierst du Nomen und Adjektive. Teile diese Summe durch 118 und multipliziere mit 100.'};
  const bars=`<div class="chart" aria-label="Deine Balken">${categoryKeys.map(c=>{
    const k='bar'+c,v=num(r.values[k]);return `<div class="chart-row ${c}"><span class="chart-name">${categories[c]}</span><span class="rail"><span class="bar-fill" style="width:${clamp(v,0,70)/70*100}%"></span></span><b>${esc(r.values[k]||'…')}</b></div>`;
  }).join('')}</div>`;
  return {title:l===1?'Welcher Balken ist am längsten?':'Wie groß ist der Unterschied?',lead:'Lies dein Balkendiagramm ab. Die Materialkarte zeigt die vier Wortzahlen.',
    body:bars+(l===1?choices('long','Wähle die Wortgruppe mit dem längsten Balken.',categoryKeys.map(c=>[c,categories[c]])):`<div class="field-row">${labelled('diff','Übrige Wörter minus Nomen und Namen',{unit:'Wörter'})}</div>`),
    hint:l===1?'Bei gleicher Skala gehört der längste Balken zur größten Anzahl.':'Subtrahiere die kleinere Wortzahl von der größeren. Hier vergleichst du Anzahlen in Wörtern.'};
}

function writing(key,title){
  return `<label class="writing" for="f-${key}"><b>${esc(title)}</b><textarea class="answer-text" id="f-${key}" data-field="${key}" maxlength="900" rows="3" placeholder="Deine Begründung …">${esc(record(station).values[key]||'')}</textarea></label>`;
}
function stripNames(r){
  return `<fieldset class="groupbox"><legend>Beschrifte die Abschnitte von links nach rechts.</legend><div class="seg-fields">${categoryKeys.map((_,i)=>`<label>Abschnitt ${i+1}<select class="answer" data-field="seg${i}" id="f-seg${i}" aria-label="Beschriftung Abschnitt ${i+1}"><option value="">Auswählen</option>${categoryKeys.map(c=>`<option value="${c}"${r.values['seg'+i]===c?' selected':''}>${categories[c]}</option>`).join('')}</select></label>`).join('')}</div></fieldset>`;
}
function duelTask(l){
  const poem=`<div class="poem-mini"><strong>„Der Pausenbeat“ · 7c</strong>${rivalLines.map((v,i)=>`<p><small>${two(i+1)}</small>${v}</p>`).join('')}</div>`;
  const compare=`<div class="compare">${['b','c'].map(letter=>{
    const cls='7'+letter, ab=letter==='b';
    return `<div class="duel-side"><b>Klasse ${cls}</b>${l===2?labelled('f'+letter,'Nomenanteil als Bruch',{fraction:true}):labelled(ab?'bn':'cn','Nomen und Namen')+labelled(ab?'bw':'cw','Wörter insgesamt')}${labelled('p'+letter,'Nomenanteil in Prozent',{decimal:true,unit:'%'})}</div>`;
  }).join('')}</div>`;
  return {title:'7b und 7c im Vergleich',lead:l===2?'Trage für beide Gedichte den Nomenanteil als Bruch und in Prozent ein. Runde bei Bedarf auf eine Nachkommastelle.':'Trage für jedes Gedicht die Anzahl der Nomen und die Gesamtwortzahl ein. Berechne die Prozentsätze und runde bei Bedarf auf eine Nachkommastelle.',
    body:poem+compare,hint:'Teile für jede Klasse ihre Nomenzahl durch ihre eigene Wortzahl. Multipliziere den Anteil mit 100.'};
}
function duelQuestion(l,r){
  const recorded=`<div class="totals-line"><b>Deine Prozentsätze</b> &nbsp; 7b: ${esc(r.values.pb||'…')} % &nbsp; · &nbsp; 7c: ${esc(r.values.pc||'…')} %</div>`;
  return {title:'Wer gewinnt das Klassenduell?',lead:l===3?'Prüfe die Aussage „Mehr Nomen bedeuten einen größeren Nomenanteil.“ Begründe dein Urteil und bestimme den Abstand in Prozentpunkten.':'Vergleiche die Nomenanteile der beiden Gedichte. Halte deinen Vergleich in einem eigenen Satz fest.',
    body:recorded+choices('sieger','Welches Gedicht hat den größeren Nomenanteil?',[['7b','Klasse 7b'],['7c','Klasse 7c'],['gleich','Beide gleich']])+writing('vergleich','Mein Vergleich')+(l===3?`<div class="field-row">${labelled('abstand','Abstand der Prozentsätze',{decimal:true,unit:'Prozentpunkte'})}</div>`:''),
    hint:l===3?'Die größere absolute Anzahl muss keinen größeren Anteil ergeben. Für den Abstand ziehst du den kleineren Prozentsatz vom größeren ab.':'Ein möglicher Satzanfang: „Das Gedicht der … hat den größeren Nomenanteil, weil …“'};
}
function bonusTask(r){
  const words=['Der','bunte','Ball','fliegt','weit.'];
  return {title:'Wie verändert sich der Adjektivanteil?',lead:'Der Vers „Der bunte Ball fliegt weit.“ kommt dazu. Markiere die neuen Adjektive und berechne den neuen Anteil.',
    body:`<div class="chips bonus-chips" data-group="bonus-mark">${words.map((w,i)=>`<button class="word-chip" data-bonus="${i}" aria-pressed="${Boolean(r.tokens['bonus'+i])}">${w}</button>`).join('')}</div><div class="field-row">${labelled('neuA','Neuer Zähler · Adjektive')}${labelled('neuW','Neuer Nenner · alle Wörter')}${labelled('neuP','Neuer Prozentsatz',{decimal:true,unit:'%'})}</div>`+choices('richtung','Wie verändert sich der Anteil gegenüber 5,9 %?',[['steigt','Er steigt.'],['sinkt','Er sinkt.']]),hint:'Zähle alle fünf neuen Wörter für den Nenner. In den Zähler kommen nur die neuen Adjektive. Auch ein Adjektiv, das ein Verb näher beschreibt, zählt.'};
}



function material(s,l){
  const poemButton=`<button type="button" class="btn pale" data-action="poem">${ico('book')}Ganzes Gedicht</button>`;
  const amountsList=`<div class="swatch-list">${categoryKeys.map(c=>`<div class="${c}"><span class="dot"></span>${categories[c]} <b>${amounts[c]}</b></div>`).join('')}</div>`;
  const tips={
    1:`<h3>Was zählt als Wort?</h3><p>„Disc-Golf“, „logo!“, „wir’s“, „GPG“ und „7b“ zählen jeweils als ein Wort. Satzzeichen, der einzelne Gedankenstrich, Titel und Versnummern zählen nicht mit.</p>${poemButton}`,
    2:`<h3>Zählregeln</h3><p>Namen, „GPG“ und „7b“ zählen zu den Nomen. „dritten“ bezieht sich auf den dritten Korb und zählt hier als Zahladjektiv. „Am liebsten“ gehört zu „gern“. Beide Wörter zählen hier zu den übrigen Wörtern.</p><details><summary>Verbformen und Adjektive</summary><p>Bei „hört mit“ markierst du nur „hört“, bei „sieht … aus“ nur „sieht“. Auch „leise“ und „hart“ zählen als Adjektive. „Zwei“ und „acht“ zählen zu den übrigen Wörtern.</p></details>
    ${l===1?`<div class="mat-support"><strong>Hilfen je Strophe</strong><p>Nomen: ${perStanza.map(x=>x.N).join(' · ')}<br>Verbformen: ${perStanza.map(x=>x.V).join(' · ')}</p></div>`:l===2?`<div class="mat-support"><strong>Werte für Strophe 2 · 3 · 4</strong><p>Nomen: ${perStanza.slice(1).map(x=>x.N).join(' · ')}<br>Adjektive: ${perStanza.slice(1).map(x=>x.A).join(' · ')}<br>Verbformen: ${perStanza.slice(1).map(x=>x.V).join(' · ')}</p></div>`:''}${poemButton}`,
    3:`<h3>Wortzahlen der 7b</h3>${amountsList}<p class="unit-read">Grundwert: ${total} Wörter.</p>`,
    4:`<h3>Die Vergleichsdaten</h3><p><b>7b</b> · 31 Nomen und Namen von 118 Wörtern.</p><p><b>7c</b> · ${l===3?'Zähle im Vergleichsgedicht.':'6 Nomen von 20 Wörtern.'}</p><div class="mat-support"><strong>Prozentsatz in %</strong><span>Nomenzahl ÷ Wortzahl × 100</span></div>${poemButton}`,
    5:`<h3>Vor dem Zusatzvers</h3><p>7 Adjektive bei 118 Wörtern. Das sind rund 5,9 %.</p><div class="mat-support"><strong>Neue Rechnung</strong><span>Verwende für Zähler und Nenner die neuen Anzahlen.</span></div>`
  };

function currentTask(s,l,i,r){
  if(s===1)return countTask(i,l,r);
  if(s===2)return i===0?markTask(l,r):amountsTask(l,r);
  if(s===3){
    if(i===0)return barsTask(r);
    const t=chartQuestion(l,r);
    if(l===3)t.body+=stripNames(r);
    return t;
  }
  if(s===4)return i===0?duelTask(l):duelQuestion(l,r);
  return bonusTask(r);
}
function tabs(){
  const r=record(station);return steps(station,state.level).map((label,i)=>`<button class="step-tab" type="button" data-step="${i}"${part()===i?' aria-current="step"':''}>${esc(label)}${r.done[i]===true?'<span class="flag" aria-label="geprüft">✓</span>':''}</button>`).join('');
}
function openTextKey(){
  if(station===1&&part()===4&&state.level===3)return 'reason';
  if(station===4&&part()===1)return 'vergleich';
  return '';
}
function solutionExample(s){
  return s===1?'4 von 16 Versen sind 25 %. In der ersten Strophe stehen 30 von 118 Wörtern, also rund 25,4 %. Das kommt daher, dass die Verse unterschiedlich viele Wörter haben.':
    'Die 7b hat mit 31 mehr Nomen als die 7c mit 6. Im kürzeren Gedicht der 7c ist der Nomenanteil mit 30 % größer als in der 7b mit rund 26,3 %.';
}
function sampleBox(){
  const r=record(station),key=openTextKey();
  if(!key||(!r.values['show'+key]&&!r.done[part()]))return '';
  return `<section class="sample" aria-label="Selbstkontrolle des eigenen Texts"><h3>Vergleiche deinen Satz</h3><p>${solutionExample(station)}</p><label class="confirm-check"><input type="checkbox" data-sample="${key}" ${r.values['ok'+key]==='ja'?'checked':''}>Mein Satz erklärt den Zusammenhang sinngemäß.</label><p class="review-note">Du kannst deinen Satz oben verbessern und danach erneut prüfen.</p></section>`;
}
function solution(s,l){
  switch(s){
    case 1:return `<p>Strophen: ${stanzaCounts.join(' · ')} Wörter. Zusammen ${total} Wörter, 16 Verse und 4 Strophen. Jede Strophe enthält 4/16 = 25 % der Verse.${l===3?' Strophe 1 enthält 30/118 ≈ 25,4 % aller Wörter.':''}</p>`;
    case 2:return `<p>${categoryKeys.map(c=>`${categories[c]}: ${amounts[c]}/${total} ≈ ${(amounts[c]*100/total).toFixed(1).replace('.',',')} %`).join('<br>')}</p>`;
    case 3:return `<p>Die Balken enden bei 31, 7, 18 und 62 Wörtern. ${l===3?'Die gerundeten Streifengrenzen sind 0, 26, 32, 47 und 100 %.':l===2?'62 − 31 = 31 Wörter Unterschied.':'Der längste Balken gehört zu den übrigen Wörtern.'}</p>`;
    case 4:return `<p>${solutionExample(4)}${l===3?' Der Abstand beträgt rund 3,7 Prozentpunkte.':''}</p>`;
    case 5:return '<p>„Bunte“ und „weit“ kommen mit fünf neuen Wörtern hinzu. 9/123 ≈ 7,3 %. Der Adjektivanteil steigt.</p>';
  }
}
function reviewBox(){
  const l=state.level,s=station,r=record(s);

  return `<section class="review" aria-label="Selbstkontrolle und Einschätzung"><h3>Deine Selbstkontrolle</h3><details><summary>Lösung zum Abgleichen</summary>${solution(s,l)}</details>

  <div class="rating" role="group" aria-label="Wie war’s?"><b>Wie war’s?</b>${['leicht','mittel','schwer'].map(v=>`<button class="choice" data-rating="${v}" aria-pressed="${r.rating===v}">${v}</button>`).join('')}</div>
  <p class="review-note">${complete(s)?'Diese Station ist auf deinem Laufzettel abgehakt.':'Setze den Haken und wähle deine Einschätzung.'}</p>
  ${complete(s)?'<a class="btn pale" href="#stationen">Zur Stationsübersicht</a>':''}</section>`;
}
function footerTask(t){
  const r=record(station),i=part(),pending=steps(station,state.level).some((_,j)=>j!==i&&r.done[j]!==true);
  const feedbackClass=feedback?.kind||(r.done[i]?'good':'');

function renderSession(){

function showValue(v){return v!==undefined&&v!==null&&String(v).trim()!==''?esc(v):'…';}
function logBody(){
  const l=state.level;
  const rows=[1,2,3,4,5].map(s=>{
    const r=record(s),v=r.values, val=k=>showValue(v[k]);
    let detail='';
    if(s===1){
      detail=`<ul>${stanzas.map((group,i)=>`<li>Strophe ${i+1}: ${group.map(x=>val('v'+x.id)).join(' + ')} = ${val('sum'+i)}</li>`).join('')}</ul><p>${val('strophen')} Strophen · ${val('verse')} Verse · ${val('gesamt')} Wörter.</p>`;
      if(l===1)detail+=`<p>Versanteil: ${val('vnum')}/16 · ${val('vshare')} %.</p>`;
      else if(l===2)detail+=`<p>Versanteil: ${val('vfrac')} · ${val('vperc')} %.</p>`;
      else detail+=`<p>Versanteil: ${val('vperc')} % · Wortanteil: ${val('wperc')} %.</p><p class="long-answer">${val('reason')}</p>`;
    }else if(s===2){
      detail=`<table class="log-table"><thead><tr><th>Wortgruppe</th><th>Anzahl</th><th>Bruch</th><th>Prozent</th></tr></thead><tbody>${categoryKeys.map(c=>`<tr><td>${categories[c]}</td><td>${val('n'+c)}</td><td>${val('f'+c)}/118</td><td>${val('p'+c)} %</td></tr>`).join('')}</tbody></table>`;
    }else if(s===3){
      detail=`<div class="chart">${categoryKeys.map(c=>`<div class="chart-row ${c}"><span class="chart-name">${categories[c]}</span><span class="rail"><span class="bar-fill" style="width:${clamp(num(v['bar'+c]),0,70)/70*100}%"></span></span><span>${val('bar'+c)}</span></div>`).join('')}</div>`;
      detail+=l===1?`<p>Längster Balken: ${esc(categories[v.long]||'…')}.</p>`:l===2?`<p>Unterschied: ${val('diff')} Wörter.</p>`:stripVisual(r)+`<p>${categoryKeys.map((_,i)=>esc(categories[v['seg'+i]]||'…')).join(' · ')}</p>`;
    }else if(s===4){
      detail=`<p>7b: ${l===2?val('fb'):val('bn')+'/'+val('bw')} · ${val('pb')} %<br>7c: ${l===2?val('fc'):val('cn')+'/'+val('cw')} · ${val('pc')} %</p><p class="long-answer">${val('vergleich')}</p>${l===3?`<p>Abstand: ${val('abstand')} Prozentpunkte.</p>`:''}`;
    }else detail=`<p>Neuer Adjektivanteil: ${val('neuA')}/${val('neuW')} ≈ ${val('neuP')} %. Der Anteil ${val('richtung')}.</p>`;
    return `<section class="record-card"><h3>${s===5?'Bonus':two(s)} · ${info[s].title}<small>${complete(s)?'✓ Erledigt':r.opened?'Begonnen':'Offen'}</small></h3>${detail}${s<5?`<p class="tiny">${r.reviewed?'✓ Kontrolliert':'Kontrolle offen'} · Wie war’s? ${showValue(r.rating)}</p>`:''}</section>`;
  }).join('');
  return `<label class="name-entry"><b>Name (freiwillig)</b><input class="answer" maxlength="60" autocomplete="off" id="log-name" value="${esc(state.name)}"></label><p class="small-note">Sternstufe ${l} · ${progress(l)} von 4 Stationen erledigt. Dein Laufzettel bleibt in diesem Browser.</p>${rows}`;
}

function stepSolution(s,l,i){
  if(s===1&&i<4){
    return `<p>Strophe ${i+1}: ${stanzas[i].map(v=>v.count).join(' + ')} = ${stanzaCounts[i]} Wörter.</p>`;
  }
  if(s===2&&i===0){
    const lines=l===2?verses.slice(0,4):verses,types=l===1?['A']:['N','A','V'];
    return lines.map(v=>{
      const strings=types.map(c=>{const words=v.words.filter(w=>w.word&&w.type===c).map(w=>esc(w.value.replace(/[.,!?]+$/,'')));return words.length?`<b>${c}</b> ${words.join(', ')}`:'';}).filter(Boolean);
      return `<p><strong>V${two(v.id)}</strong> · ${strings.join(' · ')||'keine Treffer'}</p>`;
    }).join('');
  }
  if(s===3&&i===0)return '<p>Nomen und Namen 31 · Adjektive 7 · Verbformen 18 · übrige Wörter 62.</p>';
  if(s===4&&i===0)return '<p>7b: 31/118 ≈ 26,3 %. 7c: 6/20 = 3/10 = 30 %.</p>';
  return solution(s,l);
}


const safeScroll=(node)=>{if(node)node.scrollIntoView({block:'nearest'});};
function focusControl(selector){const el=$(selector);if(el)el.focus({preventScroll:true});}
function showDialog(id){
  const el=$(id);
  if(id==='#log-dialog')$('#log-body').innerHTML=logBody();
  if(typeof el.showModal==='function'){if(!el.open)el.showModal();}
  else{el.setAttribute('open','');el.querySelector('button')?.focus();}
}
function closeDialog(dialog){if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open');}
function applyFlags(){
  const r=record(station);
  document.querySelectorAll('.task [data-field]').forEach(x=>{
    x.classList.toggle('corrected',Boolean(r.fixed[x.dataset.field]));
  });
  if(!feedback?.errors)return;
  const first=feedback.errors[0];
  const fieldEl=document.getElementById('f-'+first.key);
  if(fieldEl){fieldEl.setAttribute('aria-invalid','true');fieldEl.classList.add('error-field');}
  const group=document.querySelector(`[data-group="${first.key}"]`);
  if(group)group.classList.add('error-field');
  if(first.token)document.querySelector(`[data-mark="${first.token}"]`)?.classList.add('wrong');
}
function saveValue(key,value){
  const r=record(station);
  if(String(r.values[key]??'')===String(value))return;
  r.values[key]=String(value).slice(0,900);
  if(key==='reason'||key==='vergleich'){
    delete r.values['ok'+key];delete r.values['show'+key];
    const area=$('#sample');if(area)area.innerHTML='';
  }
  delete r.fixed[key];
  invalidate();
}
function invalidate(){
  const r=record(station),i=part();
  delete r.done[i];r.reviewed=false;feedback=null;
  const area=$('#feedback');
  if(area){area.className='feedback';area.textContent='';}
  const next=document.querySelector('[data-action=next]');if(next)next.hidden=true;
  const rev=$('#review');if(rev)rev.innerHTML='';
  const stepNav=$('.step-nav');if(stepNav)stepNav.innerHTML=tabs();
  document.querySelectorAll('.error-field,.tag-word.wrong').forEach(el=>{el.classList.remove('error-field','wrong');el.removeAttribute('aria-invalid');});
  save();
}
function onAnswer(input){
  if(input.id==='log-name'){state.name=input.value.slice(0,60);save();return;}
  if(!station)return;
  const r=record(station);
  if(input.dataset.range){
    const key=input.dataset.range,c=key.slice(3);saveValue(key,input.value);
    const numeric=document.getElementById('f-'+key);
    numeric.value=input.value;numeric.classList.remove('corrected');
    document.getElementById('fill-'+c).style.width=(100*num(input.value)/70)+'%';
    return;
  }
  if(!input.dataset.field)return;
  const k=input.dataset.field;
  saveValue(k,input.value);
  input.classList.toggle('corrected',!!r.fixed[k]);
  if(k.startsWith('bar')){
    const v=clamp(num(input.value),0,70),c=k.slice(3);
    document.querySelector(`[data-range="${k}"]`).value=v;
    document.getElementById('fill-'+c).style.width=(100*v/70)+'%';
  }
  if(k.startsWith('cut')||k.startsWith('seg')){
    const plot=$('#strip-live');if(plot)plot.innerHTML=stripVisual(r);
  }
}
function changePart(i,scroll=true){
  const r=record(station);
  if(!Number.isInteger(i)||i<0||i>=steps(station,state.level).length)return;
  r.last=i;feedback=null;hintOpen=false;markGroup=0;brush=state.level===1?'A':'N';save();
  renderSession();if(scroll){focusControl('#question');safeScroll($('#question'));}
}
function firstErrorControl(e){
  if(e.token)return document.querySelector(`[data-mark="${e.token}"]`);
  return document.getElementById('f-'+e.key)||document.querySelector(`[data-group="${e.key}"] button`);
}
function verify(){
  const r=record(station),i=part(), l=state.level;
  const issues=evaluate(station,l,i,r);
  const fields=Array.from(document.querySelectorAll('#exercise [data-field]'));
  const options=Array.from(document.querySelectorAll('#exercise [data-choice]'));
  const answered=fields.every(x=>String(r.values[x.dataset.field]||'').trim()!=='')
    &&options.every(x=>Boolean(r.values[x.dataset.choice]))
    &&(station!==2||i!==0||Object.keys(r.marks).length>0)
    &&(station!==5||Object.values(r.tokens).some(Boolean));
  if(answered)r.viewable[i]=true;
  const keys=[...document.querySelectorAll('.task [data-field],.task [data-group]')].map(el=>el.dataset.field||el.dataset.group);
  keys.forEach(k=>{if(r.changed[k]&&!issues.some(e=>e.key===k))r.fixed[k]=true;});
  if(issues.length){
    const first=issues[0];
    issues.forEach(e=>{r.changed[e.key]=true;});
    if(first.stanza!==undefined)markGroup=first.stanza;
    feedback={kind:'warn',msg:first.msg,errors:issues};delete r.done[i];r.reviewed=false;
    save();renderSession();const target=firstErrorControl(first);
    if(target){target.focus({preventScroll:true});safeScroll(target);}
    return;
  }
  const key=openTextKey();
  if(key&&r.values['ok'+key]!=='ja'){
    r.values['show'+key]='ja';
    feedback={kind:'warn',msg:'Deine Zahlen stimmen. Vergleiche deinen eigenen Satz mit dem Beispiel und bestätige die Selbstkontrolle.'};
    save();renderSession();safeScroll($('#sample'));return;
  }
  r.done[i]=true;
  feedback={kind:'good',msg:tasksDone(station)?(station===5?'Richtig. Auch mit dem neuen Vers hast du Zähler und Nenner passend gewählt.':'Alle Aufgaben dieser Station sind geprüft. Schließe deinen Laufzettel mit der Selbsteinschätzung ab.'):'Richtig. Dieser Teil ist auf deinem Laufzettel abgehakt.'};
  save();renderSession();safeScroll(tasksDone(station)&&station!==5?$('#review'):$('#feedback'));
}
function renderRoute(move){
  station=hashStation();feedback=null;hintOpen=false;brush=state.level===1?'A':'N';markGroup=0;
  if(station){const r=record(station);r.opened=true;save();renderSession();}
  else renderHome();
  document.title=station?`${info[station].title} · Gedichtstudio 7b`:'Gedichtstudio · Mathematik 7b';
  if(location.hash==='#laufzettel')$('#laufzettel')?.scrollIntoView({block:'start'});
  else if(move){window.scrollTo(0,0);main.focus({preventScroll:true});}
}
function setLevel(n){
  if(![1,2,3].includes(n)||n===state.level)return;
  state.level=n;hintOpen=false;feedback=null;markGroup=0;brush=n===1?'A':'N';
  if(station){record(station).opened=true;renderSession();}else renderHome();
  save();focusControl(`[data-level="${n}"]`);
}
document.addEventListener('input',e=>{if(e.target.matches('[data-field],[data-range],#log-name'))onAnswer(e.target);});
document.addEventListener('change',e=>{
  const el=e.target;if(el.matches('select[data-field]'))onAnswer(el);
  if(!station)return;
  if(el.hasAttribute('data-sample')){
    const r=record(station),key=el.dataset.sample;r.values['ok'+key]=el.checked?'ja':'';
    if(!el.checked&&r.done[part()])invalidate();
    save();
  }
  if(el.hasAttribute('data-review')){
    const r=record(station);r.reviewed=el.checked;save();
    $('#review').innerHTML=reviewBox();focusControl('[data-review]');
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a,dialog');
  if(!b)return;
  if(b.matches('dialog')){if(e.target===b){const rect=b.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeDialog(b);}return;}
  if(b.hasAttribute('data-close')){closeDialog(b.closest('dialog'));return;}
  if(b.classList.contains('skip')){e.preventDefault();main.focus();return;}
  if(b.dataset.level){setLevel(Number(b.dataset.level));return;}
  const action=b.dataset.action;
  if(action==='poem'){showDialog('#poem-dialog');return;}
  if(action==='log'){showDialog('#log-dialog');return;}
  if(action==='reset'){showDialog('#reset-dialog');return;}
  if(action==='reset-confirm'){
    state=fresh();save();closeDialog($('#reset-dialog'));if(location.hash==='#stationen')renderRoute(true);else location.hash='stationen';return;
  }
  if(!station)return;
  const r=record(station),i=part();
  if(b.hasAttribute('data-step')){changePart(Number(b.dataset.step));return;}
  if(b.hasAttribute('data-mark-stanza')){markGroup=Number(b.dataset.markStanza);feedback=null;renderSession();focusControl(`[data-mark-stanza="${markGroup}"]`);return;}
  if(b.dataset.brush){brush=b.dataset.brush;renderSession();focusControl(`[data-brush="${brush}"]`);return;}
  if(b.dataset.mark){
    const id=b.dataset.mark,tag=state.level===1?'A':brush;
    if(r.marks[id]===tag||tag==='O')delete r.marks[id];else r.marks[id]=tag;
    invalidate();renderSession();focusControl(`[data-mark="${id}"]`);return;
  }
  if(b.dataset.token){
    const id=b.dataset.token,verseId=Number(id.split('.')[0]);
    r.tokens[id]=!r.tokens[id];b.setAttribute('aria-pressed',String(r.tokens[id]));
    const hit=verses[verseId-1].words.filter(w=>w.word&&r.tokens[w.id]).length;
    document.getElementById('wc-'+verseId).textContent=hit+' angetippt';save();return;
  }
  if(b.hasAttribute('data-bonus')){
    const k='bonus'+b.dataset.bonus;r.tokens[k]=!r.tokens[k];b.setAttribute('aria-pressed',String(r.tokens[k]));invalidate();return;
  }
  if(b.dataset.choice){
    saveValue(b.dataset.choice,b.dataset.value);
    document.querySelectorAll(`[data-choice="${b.dataset.choice}"]`).forEach(el=>el.setAttribute('aria-pressed',String(el===b)));return;
  }
  if(b.dataset.rating){r.rating=b.dataset.rating;save();$('#review').innerHTML=reviewBox();focusControl(`[data-rating="${r.rating}"]`);return;}
  if(action==='check'){verify();return;}
  if(action==='next'){
    const arr=steps(station,state.level);
    for(let jump=1;jump<=arr.length;jump++){const j=(i+jump)%arr.length;if(!r.done[j]){changePart(j);return;}}
    return;
  }
  if(action==='hint'){hintOpen=!hintOpen;$('#hint').hidden=!hintOpen;b.setAttribute('aria-expanded',String(hintOpen));b.textContent=hintOpen?'Tipp schließen':'Tipp anzeigen';}
});
document.querySelectorAll('.glyph[data-icon]').forEach(el=>{el.innerHTML=ico(el.dataset.icon);el.setAttribute('aria-hidden','true');});
$('#dialog-poem').innerHTML=modalPoem();
window.addEventListener('hashchange',()=>renderRoute(true));
renderRoute(false);


})();</script>
